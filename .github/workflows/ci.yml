name: SportSmack CI

on:
  push:
    branches:
      - main
      - phase-21-10-3-api-worker-deployment-recovery
      - phase-21-10-4-production-security-audit
      - phase-21-10-5-monitoring-alerting-runbooks
      - phase-21-11-2-token-hardening
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SportSmack/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SportSmack/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Check process supervisor syntax and lifecycle tests
        run: |
          node --check start.js
          node --check lib/processSupervisor.js
          npm run test:supervisor

      - name: Check authentication middleware
        run: node --check middleware/auth.js

      - name: Check users routes
        run: node --check routes/users.js

      - name: Check posts routes
        run: node --check routes/posts.js

      - name: Check rate-limit middleware
        run: node --check middleware/rateLimits.js

      - name: Check Redis client and retry policy
        run: |
          node --check lib/redis.js
          node --check lib/redisOptions.js

      - name: Check background worker
        run: node --check worker.js

      - name: Check CSRF and origin policy
        run: |
          node --check middleware/csrf.js
          node --check lib/originPolicy.js
          npm run test:security

      - name: Check concurrency middleware
        run: node --check middleware/concurrency.js

      - name: Check cache service
        run: node --check services/cache.js

      - name: Check authentication routes
        run: node --check routes/auth.js

      - name: Test auth token security helpers
        run: npm run test:auth-token

      - name: Check gamecast routes
        run: node --check routes/gamecast.js

      - name: Check chat socket handler
        run: node --check sockets/chatHandler.js

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.postgres.prisma


  media-worker:
    name: Cloudflare media Worker tests and bundle check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SportSmack/media-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SportSmack/media-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Run adversarial Worker tests
        run: npm test

      - name: Validate Worker production bundle
        run: npm run check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SportSmack/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SportSmack/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
